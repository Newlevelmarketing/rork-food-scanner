<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale and user-scalable are deliberately absent. Blocking pinch
         zoom app-wide fails WCAG 1.4.4, and it is not needed to stop the
         double-tap zoom this app was guarding against: `touch-action: manipulation`
         in index.css already handles that. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F5F8" />
    <title>ModernBody — AI calorie tracking</title>
    <meta
      name="description"
      content="Point your camera at any meal and ModernBody counts the calories, protein, carbs and fat for you."
    />

    <meta property="og:title" content="ModernBody — AI calorie tracking" />
    <meta
      property="og:description"
      content="Point your camera at any meal and ModernBody counts the calories, protein, carbs and fat for you."
    />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
